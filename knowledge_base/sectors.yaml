sectors:
  - sector_id: "it_software"
    sector_name: "IT & Software"
    description: "Companies engaged in computer programming, software development, SaaS platforms, cloud infrastructure, cybersecurity, artificial intelligence, database solutions, mobile application development, enterprise software, and information technology consulting."
    keywords:
      - "software"
      - "saas"
      - "cloud computing"
      - "devops"
      - "cybersecurity"
      - "api"
      - "web development"
      - "mobile app"
      - "data engineering"
      - "machine learning"
      - "ai"
      - "crm"
      - "erp"
      - "it consulting"
    example_businesses:
      - "Snowflake"
      - "Salesforce"
      - "Databricks"
      - "CrowdStrike"
      - "Atlassian"
      - "Infosys"
      - "Custom SaaS builders"
    disambiguation_notes: "Do not classify hardware retail or consumer electronics stores here unless their primary value proposition is proprietary software/cloud services. For digital marketing tools without custom dev, consider Marketing & Advertising."
    active_status: true

  - sector_id: "healthcare_pharma"
    sector_name: "Healthcare & Pharmaceuticals"
    description: "Enterprises involved in medical services, drug discovery, pharmaceuticals, biotechnology, medical devices, clinical diagnostics, telemedicine, hospitals, clinics, and health-tech platforms."
    keywords:
      - "pharmaceuticals"
      - "biotech"
      - "medical devices"
      - "clinical trials"
      - "telemedicine"
      - "hospital"
      - "diagnostics"
      - "therapeutics"
      - "oncology"
      - "genomics"
      - "healthcare"
      - "fda approval"
    example_businesses:
      - "Pfizer"
      - "Moderna"
      - "Teladoc"
      - "Medtronic"
      - "Mayo Clinic"
      - "Quest Diagnostics"
    disambiguation_notes: "If a company sells food supplements or organic snacks, classify under Food & Beverage unless they are prescription medical foods or FDA regulated pharmaceuticals."
    active_status: true

  - sector_id: "education_edtech"
    sector_name: "Education & EdTech"
    description: "Institutions and technology providers delivering educational content, K-12 schooling, higher education, corporate training, tutoring, learning management systems (LMS), and educational certification."
    keywords:
      - "elearning"
      - "lms"
      - "tutoring"
      - "university"
      - "edtech"
      - "curriculum"
      - "student"
      - "corporate training"
      - "online courses"
      - "school management"
      - "bootcamp"
    example_businesses:
      - "Coursera"
      - "Duolingo"
      - "Udemy"
      - "Chegg"
      - "Blackboard"
      - "Byju's"
    disambiguation_notes: "Corporate leadership consulting should be categorized under Professional Services unless delivered via a dedicated education/learning platform."
    active_status: true

  - sector_id: "real_estate_construction"
    sector_name: "Real Estate & Construction"
    description: "Commercial and residential property development, architectural services, civil engineering, construction contracting, property brokerage, real estate leasing, building materials, and prop-tech."
    keywords:
      - "real estate"
      - "construction"
      - "property management"
      - "architecture"
      - "civil engineering"
      - "contractor"
      - "commercial leasing"
      - "residential development"
      - "proptech"
      - "building materials"
    example_businesses:
      - "CBRE"
      - "JLL"
      - "Bechtel"
      - "Turner Construction"
      - "Zillow"
      - "WeWork"
    disambiguation_notes: "Distinguish from hospitality (hotels) which provide short-term guest lodging rather than real estate leasing/development."
    active_status: true

  - sector_id: "retail_ecommerce"
    sector_name: "Retail & E-commerce"
    description: "Businesses selling consumer goods, apparel, electronics, direct-to-consumer (D2C) brands, omnichannel retail, marketplaces, shopping platforms, and physical department stores."
    keywords:
      - "ecommerce"
      - "online store"
      - "retail"
      - "d2c"
      - "apparel"
      - "consumer goods"
      - "marketplace"
      - "merchandise"
      - "shopping cart"
      - "fashion"
      - "electronics retail"
    example_businesses:
      - "Amazon"
      - "Shopify merchants"
      - "Zara"
      - "Target"
      - "Wayfair"
      - "ASOS"
    disambiguation_notes: "If the company primarily manufactures industrial equipment, classify under Manufacturing. If it sells prepared food/dining, classify under Food & Beverage."
    active_status: true

  - sector_id: "manufacturing"
    sector_name: "Manufacturing"
    description: "Heavy and light industrial production, precision engineering, automotive manufacturing, chemicals, aerospace parts, semiconductor fabrication, machinery, and OEM fabrication."
    keywords:
      - "industrial"
      - "machinery"
      - "fabrication"
      - "automotive assembly"
      - "oem"
      - "semiconductor manufacturing"
      - "precision engineering"
      - "cnc machining"
      - "metals"
      - "plastics molding"
      - "plant operations"
    example_businesses:
      - "Caterpillar"
      - "TSMC"
      - "Boeing"
      - "Foxconn"
      - "General Electric"
      - "Siemens Industrial"
    disambiguation_notes: "Distinguish pure industrial manufacturers from retail brands that outsource production to third parties."
    active_status: true

  - sector_id: "finance_insurance"
    sector_name: "Finance & Insurance"
    description: "Commercial and investment banking, wealth management, venture capital, private equity, fintech, payment gateways, insurance underwriting, actuarial services, accounting, and lending."
    keywords:
      - "banking"
      - "fintech"
      - "insurance"
      - "investment"
      - "wealth management"
      - "venture capital"
      - "lending"
      - "payments"
      - "credit"
      - "underwriting"
      - "crypto"
      - "asset management"
    example_businesses:
      - "JPMorgan Chase"
      - "Stripe"
      - "Goldman Sachs"
      - "Allianz"
      - "Robinhood"
      - "Visa"
    disambiguation_notes: "Pure software providers selling to banks without handling money/credit directly should be evaluated for IT & Software if their identity is tech vendor."
    active_status: true

  - sector_id: "hospitality_tourism"
    sector_name: "Hospitality & Tourism"
    description: "Hotels, resorts, travel agencies, airlines, tour operators, vacation rentals, cruise lines, event venues, and travel booking services."
    keywords:
      - "hotel"
      - "resort"
      - "travel"
      - "tourism"
      - "airline"
      - "booking"
      - "vacation rental"
      - "cruise"
      - "hospitality"
      - "itinerary"
      - "event venue"
    example_businesses:
      - "Marriott"
      - "Airbnb"
      - "Expedia"
      - "Delta Air Lines"
      - "Hilton"
      - "TripAdvisor"
    disambiguation_notes: "Restaurants and catering belong to Food & Beverage unless part of an integrated hotel/resort group."
    active_status: true

  - sector_id: "logistics_transportation"
    sector_name: "Logistics & Transportation"
    description: "Freight forwarding, supply chain management, warehousing, trucking, maritime shipping, rail freight, courier services, 3PL providers, and last-mile package delivery."
    keywords:
      - "logistics"
      - "freight"
      - "supply chain"
      - "shipping"
      - "trucking"
      - "warehousing"
      - "3pl"
      - "cargo"
      - "last-mile delivery"
      - "customs broker"
      - "fleet management"
    example_businesses:
      - "FedEx"
      - "Maersk"
      - "DHL"
      - "C.H. Robinson"
      - "Flexport"
      - "UPS"
    disambiguation_notes: "Distinguish from passenger airlines (Hospitality & Tourism) and public municipal transit."
    active_status: true

  - sector_id: "marketing_advertising"
    sector_name: "Marketing & Advertising"
    description: "Creative agencies, digital marketing, public relations (PR), SEO/SEM services, media buying, brand strategy, social media management, influencer agencies, and ad-tech platforms."
    keywords:
      - "advertising"
      - "digital marketing"
      - "seo"
      - "ppc"
      - "public relations"
      - "branding"
      - "social media marketing"
      - "creative agency"
      - "content creation"
      - "media buying"
      - "adtech"
    example_businesses:
      - "WPP"
      - "Omnicom"
      - "Ogily"
      - "HubSpot Agencies"
      - "Publicis"
      - "VaynerMedia"
    disambiguation_notes: "If an agency only builds custom web applications without marketing retainers, classify as IT & Software."
    active_status: true

  - sector_id: "food_beverage"
    sector_name: "Food & Beverage"
    description: "Restaurants, cafes, food processing, commercial agriculture, beverage manufacturing, breweries, catering, packaged foods, bakery, and agricultural produce distribution."
    keywords:
      - "restaurant"
      - "food processing"
      - "beverage"
      - "catering"
      - "agriculture"
      - "brewery"
      - "dairy"
      - "organic food"
      - "packaged goods"
      - "culinary"
      - "bakery"
    example_businesses:
      - "Nestle"
      - "Starbucks"
      - "PepsiCo"
      - "Sysco"
      - "McDonald's"
      - "Tyson Foods"
    disambiguation_notes: "Distinguish from retail supermarkets which are Retail & E-commerce, although food producers selling through them are Food & Beverage."
    active_status: true

  - sector_id: "professional_services"
    sector_name: "Professional Services"
    description: "Management consulting, legal services, law firms, human resources, talent acquisition and staffing, accounting and audit practices, business advisory, and executive coaching."
    keywords:
      - "management consulting"
      - "law firm"
      - "legal advisory"
      - "staffing"
      - "recruiting"
      - "human resources"
      - "accounting firm"
      - "business consulting"
      - "executive search"
      - "audit"
    example_businesses:
      - "McKinsey & Company"
      - "Boston Consulting Group"
      - "PwC"
      - "KPMG"
      - "Baker McKenzie"
      - "Robert Half"
    disambiguation_notes: "If consulting is strictly technical/software architecture, classify as IT & Software."
    active_status: true

  - sector_id: "other_unknown"
    sector_name: "Other / Unknown"
    description: "Unclassified leads, multi-industry conglomerates without a clear single focus, non-profits, governmental agencies, or records with insufficient business evidence to classify confidently."
    keywords:
      - "unknown"
      - "conglomerate"
      - "non-profit"
      - "government"
      - "general"
      - "unspecified"
      - "miscellaneous"
    example_businesses:
      - "Undisclosed entity"
      - "Personal email with no company info"
      - "Diversified holding company"
    disambiguation_notes: "Use this or Needs Review when business description is ambiguous or unidentifiable from the email content."
    active_status: true
