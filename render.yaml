services:
  - type: web
    name: rag-lead-segregation-agent
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en
      - key: VECTOR_STORE
        value: chroma
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma
      - key: FASTEMBED_CACHE_PATH
        value: /app/data/model_cache
      - key: MODEL_CACHE_DIR
        value: /app/data/model_cache
      - key: OMP_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: CORS_ORIGINS
        value: "*"
